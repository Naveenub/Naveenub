<svg width="900" height="40" viewBox="0 0 900 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36D1DC">
        <animate attributeName="offset" values="0;1;0" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#5B86E5">
        <animate attributeName="offset" values="1;0;1" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect x="0" y="0" rx="20" ry="20" width="900" height="40" fill="url(#grad)"/>

  <text x="50%" y="50%"
        dominant-baseline="middle"
        text-anchor="middle"
        fill="#ffffff"
        font-size="16"
        font-family="Segoe UI, Arial, sans-serif"
        font-weight="600">
    AI/ML Engineer • LLM & RAG Systems • MLOps • Production AI Infrastructure DevOps • AWS • CI/CD • Linux • AI-RAG Systems
  </text>
</svg>
